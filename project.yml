name: CaliBar
options:
  deploymentTarget:
    macOS: '14.0'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Manual
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    MARKETING_VERSION: '1.1.0'
    CURRENT_PROJECT_VERSION: '2'
targets:
  CaliBarCore:
    type: framework
    platform: macOS
    sources: [Sources/CaliBarCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robswift.DaybarCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  CaliBar:
    type: application
    platform: macOS
    sources: [Sources/CaliBar, Resources/AppIcon.icns]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: CaliBar
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: CaliBar shows your calendars in the menu bar and adds events when you choose to save them.
        NSPrincipalClass: NSApplication
        SUFeedURL: https://github.com/RobSwish/calibar/releases/latest/download/appcast.xml
        SUPublicEDKey: l+aK0Dl/NWveXhofTh9NDewLaSMbH2zIcpqNn+B2Kj4=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 86400
        SUEnableInstallerLauncherService: true
        SUEnableDownloaderService: true
    entitlements:
      path: Resources/CaliBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robswift.Daybar
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: CaliBarCore
      - package: Sparkle
schemes:
  CaliBar:
    build:
      targets:
        CaliBar: all
